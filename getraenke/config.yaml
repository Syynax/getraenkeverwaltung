name: Getränkeverwaltung
version: "1.8.0"
slug: getraenke
description: Getränkebestand, Einkauf, Events und Kassenbericht für die Feuerwehr
url: https://github.com/Syynax/getraenkeverwaltung/tree/main/getraenke
# armhf/i386 fehlen bewusst: für diese Architekturen gibt es kein
# offizielles Node-Image für die Build-Stage.
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bottle-soda-classic
panel_title: Getränke
ports:
  8099/tcp: null
ports_description:
  8099/tcp: >-
    Direktzugriff ohne Ingress. Nur nötig, wenn der Barcode-Scanner im
    Ingress-Frame keine Kamera bekommt (siehe Doku).
homeassistant_api: false
hassio_api: false
options:
  titel: Getränkeverwaltung
  untertitel: Lagerbestand, Einkauf & Kassenbericht
  anmeldung: immer
  sitzungsdauer_tage: 30
  benutzer:
    - name: admin
      passwort: bitte-aendern
  produkt_lookup: true
  automatische_sicherung: true
  sicherungen_behalten: 14
  log_level: info
schema:
  titel: str
  untertitel: str
  # immer            = Anmeldung auch im Ingress-Panel
  # nur_direktzugriff = im Ingress reicht der Home-Assistant-Login,
  #                     über Port 8099 wird angemeldet
  # aus              = keine Anmeldung
  anmeldung: list(immer|nur_direktzugriff|aus)
  sitzungsdauer_tage: int(1,365)
  benutzer:
    - name: str
      passwort: password
  # Unbekannte Barcodes bei Open Food Facts nachschlagen. Einziger ausgehender
  # Verbindungsaufbau des Add-ons – abschaltbar für den Offline-Betrieb.
  produkt_lookup: bool
  # Täglich eine Kopie der Daten in /data/sicherungen ablegen.
  automatische_sicherung: bool
  sicherungen_behalten: int(1,365)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
